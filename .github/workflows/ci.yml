name: CI Pipeline

on:
  push:
    branches:
      - 'f/**'
  workflow_dispatch:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SAST Scan (Semgrep)
        run: docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep scan --config auto

name: Staging & Security Gate

on:
  push:
    branches: [ staging ]

jobs:
  build-and-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run Container
        run: |
          docker build -t app-test .
          docker run -d -p 80:80 --name app app-test
          sleep 15
      - name: DAST Scan (ZAP)
        run: docker run -t owasp/zap2docker-stable zap-baseline.py -t http://localhost:80 -r report.html || true
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report.html
